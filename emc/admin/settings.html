<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الإعدادات · EMC CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/emc-styles.css" />
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="../js/emc-firebase.js"></script>
<script src="../js/emc-utils.js"></script>
<script src="../js/emc-segments.js"></script>
<script src="../js/emc-contacts.js"></script>
<script src="../js/emc-layout.js"></script>
</head>
<body data-screen-label="13 Settings">

<div id="emc-shell-root"></div>

<template id="settings-tpl">
  <div class="emc-crumbs">
    <a href="dashboard.html">لوحة التحكم</a>
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    <span>الإعدادات</span>
  </div>

  <div class="emc-page-head">
    <div>
      <h1 class="emc-page-title">الإعدادات</h1>
      <div class="emc-page-sub">إعدادات النظام والتكاملات</div>
    </div>
  </div>

  <div style="max-width: 680px;">

    <!-- Calendly -->
    <div class="card card-pad" style="margin-bottom: 18px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom: 6px;">
        <div style="width:38px; height:38px; border-radius:10px; background:var(--emc-cream); display:grid; place-items:center; flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--emc-navy)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        </div>
        <div>
          <h3 style="margin:0; font-size:16px; color:var(--emc-navy); font-weight:700;">رابط الحجز الذاتي</h3>
          <div style="font-size:12.5px; color:var(--emc-muted);">لحجز مكالمات الاستكشاف ذاتياً (المرحلة 6) · Calendly أو Google أو أي أداة</div>
        </div>
      </div>

      <div style="background:var(--emc-cream); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--emc-ink-2); line-height:1.7; margin:14px 0;">
        <strong>إزاي تجهّزه (مرة واحدة):</strong><br/>
        1. استخدم أي أداة حجز: <a href="https://calendly.com" target="_blank" style="color:var(--emc-navy); font-weight:600;">Calendly</a> (مجاني) أو <strong>Google Appointment Scheduling</strong> (لو عندك Google Workspace)<br/>
        2. اعمل نوع موعد واحد اسمه "مكالمة استكشاف" (45 دقيقة)<br/>
        3. انسخ لينك الحجز العام بتاعه<br/>
        4. الصقه تحت واحفظ — هيظهر زر الحجز الذاتي في ملفات العملاء
      </div>

      <div class="field" style="margin-bottom: 14px;">
        <label class="field-label">رابط الحجز الذاتي</label>
        <input class="input" type="url" id="calendly-url" placeholder="https://calendly.com/... أو https://calendar.app.google/..." />
        <div class="hint" style="font-size:11.5px; color:var(--emc-faint); margin-top:6px;">سيبه فاضي لو لسه ما جهّزتوش — النظام هيشتغل بالحجز اليدوي عادي.</div>
      </div>
      <button class="btn btn-primary btn-sm" id="save-calendly">حفظ الرابط</button>
      <span id="calendly-saved" style="display:none; margin-inline-start:10px; color:var(--emc-success); font-size:13px; font-weight:600;">✓ تم الحفظ</span>
    </div>

    <!-- جهة التواصل -->
    <div class="card card-pad" style="margin-bottom: 18px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom: 6px;">
        <div style="width:38px; height:38px; border-radius:10px; background:var(--emc-cream); display:grid; place-items:center; flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--emc-navy)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div>
          <h3 style="margin:0; font-size:16px; color:var(--emc-navy); font-weight:700;">جهة التواصل في الرسائل</h3>
          <div style="font-size:12.5px; color:var(--emc-muted);">الاسم اللي بيظهر للعميل في رسائل العرض والمتابعة</div>
        </div>
      </div>

      <div style="background:var(--emc-cream); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--emc-ink-2); line-height:1.7; margin:14px 0;">
        الاسم ده بيتحط تلقائياً في توقيع رسائل الواتساب والإيميل اللي بتتبعت للعملاء. لو سابته فاضي، النظام هيستخدم "عبدالله". لو دخل مساعد أو فريق، غيّره من هنا مرة واحدة وكل الرسائل تتحدّث.
      </div>

      <div class="field-row" style="margin-bottom: 14px;">
        <div class="field">
          <label class="field-label">اسم جهة التواصل</label>
          <input class="input" id="contact-name" placeholder="عبدالله عامر" />
        </div>
        <div class="field">
          <label class="field-label">إيميل التواصل <span class="hint">(لإرسال العروض)</span></label>
          <input class="input" type="email" id="contact-email" placeholder="abdullah@emc.academy" />
        </div>
      </div>
      <div class="field" style="margin-bottom: 14px;">
        <label class="field-label">رقم واتساب الفريق <span class="hint">(الرقم اللي العميل يكلّمه)</span></label>
        <input class="input" id="contact-whatsapp" placeholder="201001234567" />
        <div class="hint" style="font-size:11.5px; color:var(--emc-faint); margin-top:6px;">بالكود الدولي بدون + أو مسافات (مثلاً: 201001234567). ده الرقم اللي بيظهر للعميل في صفحة العرض لو حب يتواصل.</div>
      </div>
      <button class="btn btn-primary btn-sm" id="save-contact">حفظ جهة التواصل</button>
      <span id="contact-saved" style="display:none; margin-inline-start:10px; color:var(--emc-success); font-size:13px; font-weight:600;">✓ تم الحفظ</span>
    </div>

    <!-- Info card -->
    <div class="card card-pad" style="background:var(--emc-cream); border-color:var(--emc-line);">
      <h4 style="margin:0 0 8px; font-size:13.5px; color:var(--emc-navy); font-weight:700;">💡 ملاحظة عن الحجز المجاني</h4>
      <div style="font-size:12.5px; color:var(--emc-ink-2); line-height:1.7;">
        الباقة المجانية كافية تماماً (نوع موعد واحد). بعد ما العميل يحجز، Calendly بيبعتلك تأكيد بالإيميل — وقتها بتفتح ملف العميل في النظام وتسجّل الموعد بضغطة. التأكيد التلقائي الكامل بيحتاج باقة مدفوعة، وده مش ضروري دلوقتي.
      </div>
    </div>

  </div>
</template>

<script>
(async function () {
  const main = await EMC.layout.render({ page: 'settings' });
  if (!main) return;
  main.innerHTML = document.getElementById('settings-tpl').innerHTML;

  // حمّل اللينك الحالي
  const settings = await EMC.utils.getSettings();
  const input = document.getElementById('calendly-url');
  input.value = settings.calendlyUrl || '';

  document.getElementById('save-calendly').addEventListener('click', async () => {
    const btn = document.getElementById('save-calendly');
    const url = input.value.trim();
    // تحقق بسيط — أي رابط صحيح (مش Calendly فقط)
    if (url && !/^https?:\/\/.+\..+/i.test(url)) {
      EMC.utils.toast('اكتب رابط صحيح يبدأ بـ https://', 'error');
      return;
    }
    btn.disabled = true; btn.textContent = 'جاري الحفظ…';
    try {
      await EMC.utils.saveSetting('calendlyUrl', url);
      const saved = document.getElementById('calendly-saved');
      saved.style.display = 'inline';
      setTimeout(() => saved.style.display = 'none', 2500);
      EMC.utils.toast('تم حفظ رابط Calendly', 'success');
      btn.disabled = false; btn.textContent = 'حفظ الرابط';
   } catch (e) {
      EMC.utils.toast('خطأ: ' + (e.message || 'فشل الحفظ'), 'error');
      btn.disabled = false; btn.textContent = 'حفظ الرابط';
    }
  });

  // ─── جهة التواصل ───
  document.getElementById('contact-name').value = settings.contactName || '';
  document.getElementById('contact-email').value = settings.contactEmail || '';
  document.getElementById('contact-whatsapp').value = settings.contactWhatsapp || '';

  document.getElementById('save-contact').addEventListener('click', async () => {
    const btn = document.getElementById('save-contact');
    const name = document.getElementById('contact-name').value.trim();
    const email = document.getElementById('contact-email').value.trim();
    const whatsapp = document.getElementById('contact-whatsapp').value.replace(/\D/g, '');
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      EMC.utils.toast('الإيميل مش صحيح', 'error');
      return;
    }
    btn.disabled = true; btn.textContent = 'جاري الحفظ…';
    try {
      await EMC.utils.saveSetting('contactName', name);
      await EMC.utils.saveSetting('contactEmail', email);
      await EMC.utils.saveSetting('contactWhatsapp', whatsapp);
      const saved = document.getElementById('contact-saved');
      saved.style.display = 'inline';
      setTimeout(() => saved.style.display = 'none', 2500);
      EMC.utils.toast('تم حفظ جهة التواصل', 'success');
      btn.disabled = false; btn.textContent = 'حفظ جهة التواصل';
    } catch (e) {
      EMC.utils.toast('خطأ: ' + (e.message || 'فشل الحفظ'), 'error');
      btn.disabled = false; btn.textContent = 'حفظ جهة التواصل';
    }
  });
})();
</script>
</body>
</html>
